spring.datasource.url=jdbc:h2:mem:auction_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=TestSecretKeyMustBeLongEnoughForHS256AlgorithmXXXX
app.jwt.expiration-ms=3600000
app.auction.scheduler-ms=60000
app.auction.anti-snipe-window-seconds=30
app.auction.anti-snipe-extend-seconds=60
app.auction.deposit-rate=0.10
app.seed.enabled=false
