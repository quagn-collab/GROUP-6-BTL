spring.application.name=auction-system
server.port=8089

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/auction_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Phuong0109@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=Group6AuctionSecretKeyMustBeLongEnoughForHS256Algorithm2026
app.jwt.expiration-ms=86400000

# Auction scheduler
app.auction.scheduler-ms=5000
app.auction.anti-snipe-window-seconds=30
app.auction.anti-snipe-extend-seconds=60
app.auction.deposit-rate=0.10

# Seed mock data on startup
app.seed.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
